name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim: ["2.0.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Nimble for Nim 2.0
        if: matrix.nim == '2.0.x'
        shell: bash
        run: |
          nimble refresh --accept
          nimble install nimble@0.24.1 --accept
      - name: Install dependencies with Nim 2.0
        if: matrix.nim == '2.0.x'
        shell: bash
        run: "$HOME/.nimble/bin/nimble install --depsOnly --accept"
      - name: Run release checks with Nim 2.0
        if: matrix.nim == '2.0.x'
        shell: bash
        run: "$HOME/.nimble/bin/nimble releaseCheck"
      - name: Install dependencies with stable Nim
        if: matrix.nim == 'stable'
        run: nimble install --depsOnly --accept
      - name: Run release checks with stable Nim
        if: matrix.nim == 'stable'
        run: nimble releaseCheck
